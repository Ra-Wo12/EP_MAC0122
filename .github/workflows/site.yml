name: Projeto MAC0122
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Compila tudo com -Werror + ASan/UBSan, roda testes unitarios, lint dos TXT,
      # blocos C, extra (Kruskal/Dijkstra), determinismo e links. Falhou => nao publica.
      - name: Testes
        run: sh tests/run_tests.sh
      - name: Gerar o site em out/
        run: |
          gcc -std=c99 -Wall -Wextra -Iscr/A1 -Iscr/A2 -Iscr/A3 -o gera scr/A3/gera_main.c scr/A3/htmlgen.c scr/A1/txtparse.c scr/A1/slug.c scr/A2/cdestaque.c
          ./gera txt out
          touch out/.nojekyll
      - name: Conferir links do site publicado
        run: sh tests/check_links.sh out txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: out }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
