name: Projeto MAC0122
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6      
      - run: gcc -std=c99 -Wall -Wextra -Iscr/A1 -Iscr/A2 -Iscr/A3 -o gera scr/A3/gera_main.c scr/A3/htmlgen.c scr/A1/txtparse.c scr/A1/slug.c scr/A2/cdestaque.c
      - run: ./gera txt site && touch site/.nojekyll
      - run: if [ -f tests/check_links.sh ]; then sh tests/check_links.sh site; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
